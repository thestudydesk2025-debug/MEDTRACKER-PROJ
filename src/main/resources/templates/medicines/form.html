<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Medicine | Medicine Stock & Expiry Tracker</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<div class="wrapper">
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-pills fa-2x text-info"></i>
            <h4 class="mb-0 ms-2 text-white">MedTracker</h4>
        </div>
        <ul class="list-unstyled components">
            <li><a th:href="@{/}"><i class="fa-solid fa-gauge-high"></i> Dashboard</a></li>
            <li class="active"><a th:href="@{/medicines}"><i class="fa-solid fa-capsules"></i> Medicines</a></li>
            <li><a th:href="@{/inventory}"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a></li>
            <li><a th:href="@{/alerts}"><i class="fa-solid fa-triangle-exclamation"></i> Stock Alerts</a></li>
            <li><a th:href="@{/expiry}"><i class="fa-regular fa-calendar-xmark"></i> Expiry Tracker</a></li>
            <li><a th:href="@{/reorders}"><i class="fa-solid fa-cart-shopping"></i> Reorder Management</a></li>
            <li><a th:href="@{/suppliers}"><i class="fa-solid fa-truck-field"></i> Suppliers</a></li>
            <li><a th:href="@{/categories}"><i class="fa-solid fa-layer-group"></i> Categories</a></li>
            <li><a th:href="@{/transactions}"><i class="fa-solid fa-money-bill-transfer"></i> Transactions</a></li>
            <li><a th:href="@{/reports}"><i class="fa-solid fa-chart-pie"></i> Reports</a></li>
        </ul>
        <ul class="list-unstyled components mt-auto">
            <li><a th:href="@{/settings}"><i class="fa-solid fa-gear"></i> Settings</a></li>
            <li>
                <form th:action="@{/logout}" method="post" class="m-0 p-0">
                    <button type="submit" class="btn btn-link w-100 text-start sidebar-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
                </form>
            </li>
        </ul>
    </nav>

    <!-- Page Content -->
    <div id="content" class="w-100">
        
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4 top-navbar">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-info text-white"><i class="fa-solid fa-bars"></i></button>
                <div class="ms-3 d-none d-md-block"><h5 class="mb-0 text-dark fw-bold">Medicines Directory</h5></div>
            </div>
        </nav>

        <div class="container-fluid content-area fade-in">
            
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-header bg-white py-3 border-bottom">
                            <h5 class="mb-0 fw-bold text-primary" th:text="${medicine.id != null ? 'Edit Medicine' : 'Add New Medicine'}">
                                Manage Medicine
                            </h5>
                        </div>
                        <div class="card-body p-4">
                            
                            <form th:action="@{/medicines/save}" th:object="${medicine}" method="post">
                                <input type="hidden" th:field="*{id}" />
                                
                                <h6 class="text-uppercase text-muted fw-bold mb-3">General Information</h6>
                                <div class="row mb-4">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Medicine Name <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" th:field="*{name}" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Generic Name</label>
                                        <input type="text" class="form-control" th:field="*{genericName}">
                                    </div>
                                    
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Category <span class="text-danger">*</span></label>
                                        <select class="form-select" th:field="*{category.id}" required>
                                            <option value="">Select Category...</option>
                                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Batch Number <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" th:field="*{batchNumber}" required>
                                    </div>
                                </div>

                                <h6 class="text-uppercase text-muted fw-bold mb-3">Stock & Supplier</h6>
                                <div class="row mb-4">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Supplier <span class="text-danger">*</span></label>
                                        <select class="form-select" th:field="*{supplier.id}" required>
                                            <option value="">Select Supplier...</option>
                                            <option th:each="sup : ${suppliers}" th:value="${sup.id}" th:text="${sup.companyName}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-3 mb-3">
                                        <label class="form-label">Quantity <span class="text-danger">*</span></label>
                                        <input type="number" class="form-control" th:field="*{quantity}" min="0" required>
                                    </div>
                                    <div class="col-md-3 mb-3">
                                        <label class="form-label">Min Stock <span class="text-danger">*</span></label>
                                        <input type="number" class="form-control" th:field="*{minimumStock}" min="1" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Unit Price</label>
                                        <div class="input-group">
                                            <span class="input-group-text">₹</span>
                                            <input type="number" step="0.01" class="form-control" th:field="*{unitPrice}">
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Storage Location</label>
                                        <input type="text" class="form-control" th:field="*{storageLocation}">
                                    </div>
                                </div>

                                <h6 class="text-uppercase text-muted fw-bold mb-3">Dates & Status</h6>
                                <div class="row mb-4">
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label">Mfg. Date</label>
                                        <input type="date" class="form-control" th:field="*{manufacturingDate}">
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label">Expiry Date <span class="text-danger">*</span></label>
                                        <input type="date" class="form-control" th:field="*{expiryDate}" required>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label">Status <span class="text-danger">*</span></label>
                                        <select class="form-select" th:field="*{status}" required>
                                            <option value="ACTIVE">Active</option>
                                            <option value="INACTIVE">Inactive</option>
                                        </select>
                                    </div>
                                    <div class="col-12 mb-3">
                                        <label class="form-label">Description</label>
                                        <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 mt-4">
                                    <a th:href="@{/medicines}" class="btn btn-light border px-4">Cancel</a>
                                    <button type="submit" class="btn btn-primary px-4"><i class="fa-solid fa-save me-1"></i> Save Medicine</button>
                                </div>
                            </form>
                            
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
