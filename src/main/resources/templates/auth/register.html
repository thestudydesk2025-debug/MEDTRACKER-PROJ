<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Medicine Stock & Expiry Tracker</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .auth-container { max-width: 550px; }
    </style>
</head>
<body class="auth-body">

    <!-- Animated Background Particles -->
    <div class="particles">
        <ul style="list-style: none; padding: 0; margin: 0;">
            <li class="particle"></li>
            <li class="particle"></li>
            <li class="particle"></li>
            <li class="particle"></li>
            <li class="particle"></li>
            <li class="particle"></li>
        </ul>
    </div>

    <div class="auth-container slide-up my-4">
        <div class="auth-card">
            <div class="auth-logo mb-4">
                <i class="fa-solid fa-user-plus text-info"></i>
                <h3>Create Account</h3>
                <p>Join the MedTracker system</p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger fade-in">
                <i class="fa-solid fa-circle-exclamation me-2"></i> <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/register}" th:object="${user}" method="post">
                
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" th:field="*{fullName}" placeholder="John Doe" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" th:field="*{username}" placeholder="johndoe" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" th:field="*{email}" placeholder="john@example.com" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" th:field="*{password}" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" th:field="*{confirmPassword}" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone (Optional)</label>
                        <input type="text" class="form-control" th:field="*{phone}" placeholder="+1 234 567 8900">
                    </div>
                    
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold text-info">Access Key</label>
                        <input type="text" class="form-control border-info" th:field="*{accessKey}" placeholder="Required for registration" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('accessKey')}" th:errors="*{accessKey}"></div>
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="terms" required>
                    <label class="form-check-label text-muted small" for="terms">
                        I agree to the Terms of Service and Privacy Policy
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Register Account</button>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted">Already have an account?</span> <a th:href="@{/login}" class="text-decoration-none fw-semibold text-info">Sign In</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
