<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Supplier | Medicine Stock & Expiry Tracker</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<div class="wrapper">
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-pills fa-2x text-info"></i>
            <h4 class="mb-0 ms-2 text-white">MedTracker</h4>
        </div>
        <ul class="list-unstyled components">
            <li><a th:href="@{/}"><i class="fa-solid fa-gauge-high"></i> Dashboard</a></li>
            <li><a th:href="@{/medicines}"><i class="fa-solid fa-capsules"></i> Medicines</a></li>
            <li><a th:href="@{/inventory}"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a></li>
            <li><a th:href="@{/alerts}"><i class="fa-solid fa-triangle-exclamation"></i> Stock Alerts</a></li>
            <li><a th:href="@{/expiry}"><i class="fa-regular fa-calendar-xmark"></i> Expiry Tracker</a></li>
            <li><a th:href="@{/reorders}"><i class="fa-solid fa-cart-shopping"></i> Reorder Management</a></li>
            <li class="active"><a th:href="@{/suppliers}"><i class="fa-solid fa-truck-field"></i> Suppliers</a></li>
            <li><a th:href="@{/categories}"><i class="fa-solid fa-layer-group"></i> Categories</a></li>
            <li><a th:href="@{/transactions}"><i class="fa-solid fa-money-bill-transfer"></i> Transactions</a></li>
            <li><a th:href="@{/reports}"><i class="fa-solid fa-chart-pie"></i> Reports</a></li>
        </ul>
    </nav>

    <!-- Page Content -->
    <div id="content" class="w-100">
        
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4 top-navbar">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-info text-white">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="ms-3 d-none d-md-block">
                    <h5 class="mb-0 text-dark fw-bold">Add Supplier</h5>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <div class="container-fluid content-area fade-in">
            <div class="card shadow-sm border-0 max-w-800">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold"><i class="fa-solid fa-plus text-info me-2"></i> Add New Supplier</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/suppliers/add}" th:object="${supplier}" method="post">
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="companyName" class="form-label fw-semibold">Company Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="companyName" th:field="*{companyName}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="contactPerson" class="form-label fw-semibold">Contact Person</label>
                                <input type="text" class="form-control" id="contactPerson" th:field="*{contactPerson}">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="phone" class="form-label fw-semibold">Phone Number</label>
                                <input type="text" class="form-control" id="phone" th:field="*{phone}">
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold">Email Address</label>
                                <input type="email" class="form-control" id="email" th:field="*{email}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label fw-semibold">Address</label>
                            <textarea class="form-control" id="address" rows="3" th:field="*{address}"></textarea>
                        </div>
                        
                        <div class="mb-4">
                            <label for="status" class="form-label fw-semibold">Status</label>
                            <select class="form-select" id="status" th:field="*{status}">
                                <option value="ACTIVE">ACTIVE</option>
                                <option value="INACTIVE">INACTIVE</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/suppliers}" class="btn btn-light border">Cancel</a>
                            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i> Save Supplier</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
