<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories | Medicine Stock & Expiry Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="wrapper">
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header"><i class="fa-solid fa-pills fa-2x text-info"></i><h4 class="mb-0 ms-2 text-white">MedTracker</h4></div>
        <ul class="list-unstyled components">
            <li><a th:href="@{/}"><i class="fa-solid fa-gauge-high"></i> Dashboard</a></li>
            <li><a th:href="@{/medicines}"><i class="fa-solid fa-capsules"></i> Medicines</a></li>
            <li><a th:href="@{/inventory}"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a></li>
            <li><a th:href="@{/alerts}"><i class="fa-solid fa-triangle-exclamation"></i> Stock Alerts</a></li>
            <li><a th:href="@{/expiry}"><i class="fa-regular fa-calendar-xmark"></i> Expiry Tracker</a></li>
            <li><a th:href="@{/reorders}"><i class="fa-solid fa-cart-shopping"></i> Reorder Management</a></li>
            <li><a th:href="@{/suppliers}"><i class="fa-solid fa-truck-field"></i> Suppliers</a></li>
            <li class="active"><a th:href="@{/categories}"><i class="fa-solid fa-layer-group"></i> Categories</a></li>
            <li><a th:href="@{/transactions}"><i class="fa-solid fa-money-bill-transfer"></i> Transactions</a></li>
            <li><a th:href="@{/reports}"><i class="fa-solid fa-chart-pie"></i> Reports</a></li>
        </ul>
    </nav>
    <div id="content" class="w-100">
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4 top-navbar">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-info text-white"><i class="fa-solid fa-bars"></i></button>
                <div class="ms-3 d-none d-md-block"><h5 class="mb-0 text-dark fw-bold">Categories</h5></div>
            </div>
        </nav>
        <div class="container-fluid content-area fade-in">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3"><h5 class="mb-0 fw-bold"><i class="fa-solid fa-layer-group text-info me-2"></i> Category List</h5></div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light"><tr><th>Category Name</th><th>Description</th><th class="text-center">Total Medicines</th></tr></thead>
                        <tbody>
                            <tr th:each="c : ${categories}">
                                <td class="fw-bold" th:text="${c.name}"></td>
                                <td th:text="${c.description}"></td>
                                <td class="text-center"><span class="badge bg-primary rounded-pill" th:text="${categoryCounts.get(c.id)}"></span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
